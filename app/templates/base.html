<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/studio.css">
  <!-- three.js addons (OrbitControls, GLTFLoader, CSS2DRenderer) import the bare
       specifier "three", which a browser can only resolve through an import map.
       This must appear before any module is imported. It costs nothing on pages
       that never load the 3D viewer — a map is a declaration, not a download. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="site-header">
    <h1>{{ app_name }}</h1>
    <nav>
      <a href="/studio">Studio</a>
      <a href="/docs">API docs</a>
      <a href="/health">Health</a>
    </nav>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
